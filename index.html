    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            var activeFetch = origFetch.bind(window);
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return activeFetch; },
                set: function(fn) { if (typeof fn === 'function') activeFetch = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }
          window.addEventListener('error', function(ev) {
            var m = (ev && ev.message) ? ev.message : '';
            if (m.indexOf('property fetch') !== -1 || m.indexOf('only a getter') !== -1) {
              if (ev.preventDefault) ev.preventDefault();
            }
          });
        } catch(e) {}
      })();
    </script>
  </head>
